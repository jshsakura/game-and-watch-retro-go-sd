name: Generate gw_update.tar

on:
  push:
    branches:
      - testbed
    tags:
      - 'v*'
      - 'testbed-full-*'
  pull_request:
    branches:
      - main

# One in-flight run per ref: a new push to a branch (or PR) cancels the older,
# now-superseded run of that same ref. Tag runs publish a release, so they are
# never cancelled — each ref is its own group, so a branch push and its release
# tag do not cancel each other either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build test
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/opt/workdir sylverb/retro-go-sd-builder:v1.5 \
            bash -l -c "printf 'tries = 5\nwaitretry = 15\nretry_on_http_error = 429,500,502,503\n' > /tmp/wgetrc && export WGETRC=/tmp/wgetrc && make -j\$$(nproc) CHECK_DIRTY_SUBMODULE=0 COVERFLOW=1 SHARED_HIBERNATE_SAVESTATE=1 DISABLE_SPLASH_SCREEN=1 ENABLE_BOOT_OC=1 INTFLASH_BANK=2 CHEAT_CODES=1 ZH_CN=1 ZH_TW=1 KO_KR=1 JA_JP=1 release"

  host-tests:
    # Host unit tests (tests/run.sh): clock alarm/cfg/editor state machines,
    # favorites file ops, rg_storage compiled BOTH ways (FatFs + FrogFS stubs),
    # GIF decode, firmware-update tar extractor, merge-hygiene logo guard.
    # Cheap, no toolchain: plain gcc.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Fetch the firmware_update submodule
        # tests/test_fw_tar.c compiles the real tar.c against the real FatFs from
        # this submodule. Only this one — pulling them all costs minutes here.
        run: git submodule update --init --depth 1 external/firmware_update
      - name: Fetch the retro-go-stm32 submodule
        # tests/test_favorites*.c compile the real rg_favorites.c against the
        # real Core/Inc headers, and those chain into this submodule's
        # config.h / odroid_sdcard.h. They used to be stubbed in
        # tests/fav_stubs, which is how the suite kept building a different
        # program than the firmware. Small submodule; still not all of them.
        run: git submodule update --init --depth 1 retro-go-stm32
      - name: Fetch the sm submodule
        # tools/cx4_harness compiles external/sm/src/snes/cx4_hle.c itself, under
        # ASan, to prove the chip's cartridge-controlled lengths stay inside its
        # 8 KB RAM. Without this the harness has no file and skips -- which is
        # how a gate becomes decoration. Same reasoning as the two above: named
        # explicitly, --depth 1, not "all submodules".
        run: git submodule update --init --depth 1 external/sm
      - name: Install Pillow (GIF fixture generator)
        run: pip3 install --quiet Pillow
      - name: Run host test suite
        run: bash tests/run.sh

  rig-build-test:
    # The QEMU rig is our primary measuring instrument and no other job
    # compiles it. 6378f72e broke its build (pico_int.h stub collision at
    # rig_32x.c) and shipped green because CI never looked -- the break was
    # found days later, by accident, when the slice census refused to build.
    # An instrument that silently does not compile invalidates every
    # measurement made after it. A full run needs a Doom ROM CI cannot
    # ship, so this gate proves the toolchain path end-to-end: every
    # picodrive TU + the rig harness compiled and linked (RIG_BUILD_ONLY).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      - name: Rig compile gate
        run: |
          # objcopy rejects an empty input, and the gate only compiles+links --
          # the ROM bytes are never read. Hand it the smallest legal 32x image.
          printf "\x00\x01\x02\x03" > /tmp/dummy.32x
          RIG_BUILD_ONLY=1 EXTRA_DEF="-Wno-error=incompatible-pointer-types" bash tools/m7_qemu_rig/run_32x.sh /tmp/dummy.32x 1

  build-sd0-test:
    # Non-SD (flash-only, SD_CARD=0) build must stay green: FrogFS + LittleFS
    # images and the FLASH.ld link are exercised by no other job. This is the
    # configuration a Game & Watch WITHOUT the SD mod runs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: Build test (SD_CARD=0)
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/opt/workdir sylverb/retro-go-sd-builder:v1.5 \
            bash -l -c "make -j\$$(nproc) CHECK_DIRTY_SUBMODULE=0 SD_CARD=0 COVERFLOW=0 DISABLE_SPLASH_SCREEN=1 INTFLASH_BANK=2 KO_KR=1 EXTFLASH_SIZE_MB=64 all"

  lynx-core-test:
    # Host-side AddressSanitizer test of the Atari Lynx core (external/handy-go),
    # which is shared verbatim with the device overlay. Runs on every push/PR
    # ALONGSIDE the firmware build so Lynx load-path memory bugs (e.g. the BS93
    # big-endian header OOB-write) are caught before anything is flashed — the
    # device itself can't safely run an unverified core. No toolchain/docker
    # needed; ubuntu-latest ships g++ + python3.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: Lynx host core test (ASan + UBSan)
        run: cd linux && ./run_lynx_host_test.sh

  release-package:
    # This job had no `needs:` for its whole life, so a tag published a release
    # no matter what the tests said. On 2026-08-20 that came due: every run since
    # 0818 had been failing on two nhdoom gates, releases kept going out anyway,
    # and the red X became the normal state of the repo that nobody read. A gate
    # that never stops anything is not a gate.
    #
    # So the release is gated now. All three are cheap and they test what ships:
    # host-tests is plain gcc, lynx-core-test compiles the Lynx core that ships
    # in gw_update.tar, and build-sd0-test is the variant a linker-script change
    # breaks first. Each already SKIPs (loudly) rather than fails when a tool or
    # git history is missing, which is the reason this can be a hard dependency
    # without becoming the thing that breaks the build.
    #
    # If a release is genuinely urgent and a gate is genuinely wrong: fix or skip
    # the gate in a commit, then tag that commit. Do not remove this `needs:` --
    # the whole point is that the field build comes from a green tree.
    needs: [host-tests, lynx-core-test, build-sd0-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout the repository with submodules (full history + tags so the
      #    release notes can diff this tag against the previous one)
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: true  # Clone submodules with --recurse-submodules
          fetch-depth: 0
          fetch-tags: true

      # 2. Generate the update files using Docker
      #
      # SNES_LINE_CACHE is OFF now: the device answered again, in the scene the
      # game is actually played in. Zelda 3 rain, 900 deterministic frames from a
      # savestate: ON 52.21 fps, OFF 55.45 (+3.24, +6.2%), with the cache hitting
      # on 1,713 lines and missing on 27,407 -- 5.9%. The tracking is charged on
      # every VRAM access regardless. The old verdict below was measured on the
      # attract screen, a still image, which is where a line cache looks best.
      # Kept for the record:
      # SNES_LINE_CACHE=1 stays on: the device answered. A Link to the Past used
      # to dip to 40 fps in the heavy scenes and now holds 51, SMW reads 49.5,
      # and CPU busy fell from 99.5% to 89-92% -- the heavy frames stopped
      # saturating, which is what a line-reuse cache is for. It cuts the peak,
      # not the average, so do not judge it by an average fps number, and do not
      # remove it on the strength of the host harness reporting 4.6% MORE time:
      # a host has no memory stalls for a reused line to save.
      - name: Generate firmware_update.bin and gw_update.tar
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/opt/workdir sylverb/retro-go-sd-builder:v1.5 \
            bash -l -c "printf 'tries = 5\nwaitretry = 15\nretry_on_http_error = 429,500,502,503\n' > /tmp/wgetrc && export WGETRC=/tmp/wgetrc && make -j\$$(nproc) CHECK_DIRTY_SUBMODULE=0 COVERFLOW=1 SHARED_HIBERNATE_SAVESTATE=1 DISABLE_SPLASH_SCREEN=1 ENABLE_BOOT_OC=1 INTFLASH_BANK=2 CHEAT_CODES=1 ZH_CN=1 ZH_TW=1 KO_KR=1 JA_JP=1 release"

      # 3. Compose release notes: what CHANGED in this build (commits since the
      #    previous tag). The full feature overview lives in the README, linked —
      #    not pasted — so each release reads as its delta.
      - name: Compose release notes
        run: |
          {
            echo "**Experimental testbed build — not stable. Back up your SD card / saves first.**"
            echo ""
            echo "Install: flash \`retro-go_update.bin\` (matching SD support files are pushed automatically; \`gw_update.tar\` is manual recovery only). ROMs are never bundled."
            echo ""
            echo "Full feature overview & BIOS table: [README — How this fork differs from upstream](https://github.com/${{ github.repository }}#how-this-fork-differs-from-upstream)"
            echo ""
            # State the stance in every release, not just the ones that merged
            # something: this fork FOLLOWS sylverb/game-and-watch-retro-go-sd.
            # Upstream is the reference and its releases are merged as they come.
            # Where a merge conflicts, upstream's version is taken -- the
            # exceptions are the few places where taking it would break the
            # device (a shrinking APPID_COUNT resets every user's settings, a
            # shifted logo index breaks cards already in the field), and each of
            # those is documented at the line in the source.
            echo "> **This fork follows [upstream](https://github.com/sylverb/game-and-watch-retro-go-sd).**"
            echo "> Upstream is the reference: its releases are merged here as they land, and where a"
            echo "> merge conflicts, upstream's version is the one taken. The only exceptions are"
            echo "> changes that would break an existing device or card — a shrinking \`APPID_COUNT\`"
            echo "> resets every user's settings, a shifted logo index breaks cards already in the"
            echo "> field — and each of those is documented at the line in the source."
            echo ""
            PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              RANGE="$PREV..${{ github.ref_name }}"
            else
              echo "## Changes in this build"
              RANGE="-20"
            fi
            echo ""
            # Subject as a heading, full commit body as the explanation —
            # the bodies are written to be read, so the release explains
            # itself instead of listing bare one-liners.
            #
            # Exclude docs commits: a firmware release's changelog is firmware
            # changes. The docs-site / devlog series (docs(site): …) is website
            # work and only cluttered the notes.
            git log --no-merges --invert-grep --grep='^docs' \
              --pretty=format:'### %s%n%n%b%n' $RANGE
            echo ""
          } > RELEASE_NOTES.md

      # 4. Publish. A release for this tag may already exist: some are cut by hand
      #    (`gh release create`) with notes written for the occasion, and the tag
      #    that creates lands here a moment later. actions/create-release@v1 could
      #    only ever create, so it failed with "already_exists" on every one of
      #    those — a red X on a workflow that had in fact built everything
      #    correctly. A safety net that cries wolf on success is a safety net
      #    people learn to scroll past.
      #
      #    So: create it if it is not there, and either way replace the artifacts
      #    with the ones THIS job just built. A clean-checkout build is the one
      #    that should ship, not whatever was lying in someone's release/ folder.
      #    Hand-written notes are left alone — CI has nothing to add to them that
      #    the author did not already say.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — keeping its notes, replacing its artifacts."
          else
            echo "Creating release $TAG from the commit bodies."
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" \
            release/retro-go_update.bin \
            release/gw_update.tar \
            --clobber
